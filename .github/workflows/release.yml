# Builds the single-file executables and attaches them to a GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or by hand (Actions → Release → Run workflow), which only
# uploads the files as a build artifact.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # report every OS, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/platform.test.js test/secrets.test.js test/register.test.js test/processes.test.js
      - run: node bin/zaafpulse.js doctor
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest   # Linux and Windows binaries (postject works across formats)
            targets: linux-x64 linux-arm64 win-x64 win-arm64
          - runner: macos-latest    # macOS binaries need codesign
            targets: darwin-arm64 darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-single.js ${{ matrix.targets }}
      - run: mv dist/SHA256SUMS.txt dist/SHA256SUMS-${{ runner.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zaafpulse-${{ runner.os }}
          path: dist/*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Build provenance (Sigstore): each file is signed as made by this workflow from this commit.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The app files the installers use, checksummed with the binaries (install.sh / install.ps1 verify it).
      - name: Source package
        run: |
          V="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="zaafpulse-$V/" -o "dist/zaafpulse-$V-source.tar.gz" "$GITHUB_REF_NAME" \
            bin lib public skills scripts server.js mcp.js package.json config.example.json README.md LICENSE
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt && rm dist/SHA256SUMS-*.txt
          (cd dist && sha256sum "zaafpulse-$V-source.tar.gz" >> SHA256SUMS.txt)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ZAAFPulse $GITHUB_REF_NAME" --generate-notes
