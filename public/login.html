<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZAAFPulse · Sign in</title>
  <style>
    :root { --bg: #08111a; --card: #0f1c28; --border: #1f3346; --text: #e6ebff; --muted: #7f93a6; --accent: #4cc3d9; --bad: #ff6b81; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(1200px 600px at 70% 20%, #12304a 0%, var(--bg) 60%); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: #122130; border: 1px solid var(--border); }
    .name { font-weight: 800; font-size: 20px; letter-spacing: -.01em; } .name span { color: var(--accent); }
    .sub { font-size: 10.5px; letter-spacing: .14em; color: var(--muted); }
    label { display: block; font-weight: 600; font-size: 12.5px; margin-bottom: 6px; }
    input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0a1520; color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #04202a; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .err { color: var(--bad); min-height: 20px; margin-top: 10px; font-size: 13px; }
    .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  </style>
</head>
<body>
  <form id="f" autocomplete="on">
    <div class="brand">
      <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4cc3d9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
      <div><div class="name">ZAAF<span>Pulse</span></div><div class="sub">AI COMMAND CENTER</div></div>
    </div>
    <label for="pw">Admin password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
    <p class="note">This ZAAFPulse runs in server mode. Forgot the password? Run <code>zaafpulse set-password</code> on the server.</p>
  </form>
  <script src="login.js"></script>
</body>
</html>
