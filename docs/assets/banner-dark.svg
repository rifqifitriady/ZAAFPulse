<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="ZAAFPulse: AI command center and agentic workspace for macOS, Linux and Windows, on a laptop or a server">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:62px;font-weight:800;letter-spacing:-1.5px;fill:#eef3f7}
  .eyebrow{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:4px;fill:#4cc3d9}
  .tag{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:19px;fill:#aab8c5} .pill{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600;fill:#eef3f7}
  .edges line{stroke:#5d6f80;stroke-width:1.1;opacity:.45}
  .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .node{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
  .beat{stroke-dasharray:150;stroke-dashoffset:150;animation:beat 3.2s ease-in-out infinite}
  .ekg{stroke-dasharray:1400;stroke-dashoffset:1400;animation:ekg 6s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  @keyframes pop{from{opacity:0;transform:scale(.2)}}
  @keyframes beat{0%{stroke-dashoffset:150}45%,70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes ekg{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.beat,.ekg{stroke-dashoffset:0}}
</style>
